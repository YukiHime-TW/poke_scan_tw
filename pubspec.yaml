name: poke_scan_tw
description: Traditional Chinese Pokemon Scanner
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0' # 確保這裡是 3.3.0 或更高

dependencies:
  flutter:
    sdk: flutter
  # 狀態管理
  provider: ^6.1.1
  # 本地儲存
  shared_preferences: ^2.2.2
  # 相機模組
  camera: ^0.10.5+9
  # Google ML Kit (OCR 文字辨識)
  google_mlkit_text_recognition: ^0.11.0
  # 權限管理
  permission_handler: ^11.3.0
  sliver_tools: ^0.2.12
  # Firebase 相關套件
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1
  flutter_launcher_icons: ^0.13.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  intl: ^0.18.0
  js: ^0.6.7  # 加入這一行
  image: ^4.8.0
  http: ^1.2.0
  path_provider: ^2.1.2

# 圖示由 scripts/gen_icons.py 產生（集換所：雙疊卡片，深紫 #4B3BA6）
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4B3BA6"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    # 這是索引檔
    - assets/index.json
    # 這是存放所有擴充包的資料夾 (注意最後要有斜線 /)
    - assets/sets/